name: Speedbreaker
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_ENTITLEMENTS: Configuration/Prototype.entitlements
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
targetTemplates:
  ScreenTimeExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
targets:
  Speedbreaker:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.burooj.speedbreaker.ios
        INFOPLIST_FILE: Configuration/App.plist
    dependencies:
      - target: ActivityMonitor
        embed: true
      - target: ShieldConfiguration
        embed: true
      - target: ShieldAction
        embed: true
  ActivityMonitor:
    templates: [ScreenTimeExtension]
    sources:
      - Monitor
      - Shared
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.burooj.speedbreaker.ios.monitor
        INFOPLIST_FILE: Configuration/Monitor.plist
  ShieldConfiguration:
    templates: [ScreenTimeExtension]
    sources: [ShieldConfiguration]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.burooj.speedbreaker.ios.shield-configuration
        INFOPLIST_FILE: Configuration/ShieldConfiguration.plist
  ShieldAction:
    templates: [ScreenTimeExtension]
    sources: [ShieldAction]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.burooj.speedbreaker.ios.shield-action
        INFOPLIST_FILE: Configuration/ShieldAction.plist
schemes:
  Speedbreaker:
    build:
      targets:
        Speedbreaker: all
        ActivityMonitor: all
        ShieldConfiguration: all
        ShieldAction: all
