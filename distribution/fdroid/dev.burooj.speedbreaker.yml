AutoName: Speedbreaker
Summary: A breathing pause before chosen apps
Description: |
  Speedbreaker adds a breathing pause when you open apps you choose, with
  optional check-ins during continuous visible use. The first eight seconds
  lock ordinary navigation; Android safety screens such as Settings and
  incoming-call UI can interrupt the pause. You can continue, leave, or
  redirect to a configured alternative after the lock.

  Speedbreaker uses an Accessibility service to identify the visible app and
  mediate navigation. The Android Phone permission is used only to check
  whether Android reports a call; breathing pauses stay off when this access
  is unavailable. Notifications are used for active pause controls.

  Settings, selected apps, schedules, and pause state are stored on the device.
  The app has no account, analytics, ads, cloud sync, or Internet permission,
  and does not upload app activity.

