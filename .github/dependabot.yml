version: 2
updates:
  # Owner decision (Oct 17, 2026): only keep CI's own actions current, twice a year,
  # in one grouped PR. Speedbreaker has no Internet permission, so app libraries are
  # upgraded deliberately (yearly, or for Android's target-SDK requirement) instead.
  # Workflow actions are pinned to full SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
