name: Android device regression

on:
  # Registers this new workflow without changing the default branch or the main checks.
  push:
    branches: [test/device-regression]
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'App source revision to test; empty uses this workflow revision'
        type: string
        default: ''
      baseline_without_phone_permission:
        description: 'Pre-fix negative control only: allow absent phone permission (call tests must still fail)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  incoming-call:
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out app candidate separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The isolated tooling branch validates the explicitly requested candidate.
          ref: ${{ inputs.app_ref || (github.ref == 'refs/heads/test/device-regression' && '2b0bbddbd3ce647c67282a6c6680d072421a647f') || github.sha }}
          path: source-app
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install build SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build app candidate
        working-directory: source-app
        run: ./gradlew :app:assembleCommunityDebug --no-daemon --no-configuration-cache --max-workers=2
      - name: Build isolated fixture
        run: ./gradlew -PcallFixture=true :call-fixture:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Telecom and SystemUI
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          BASELINE_WITHOUT_PHONE_PERMISSION: ${{ inputs.baseline_without_phone_permission }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/call-fixture/ci.py
      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-api${{ matrix.api }}-${{ github.sha }}
          path: |
            build/device-regression/
            tools/call-fixture/build/outputs/apk/debug/
            source-app/app/build/outputs/apk/community/debug/
          retention-days: 7
