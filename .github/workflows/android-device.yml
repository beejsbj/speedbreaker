name: Android device regression

on:
  push:
    branches: [main, release/store-demo]
    paths:
      - 'app/**'
      - 'tools/call-fixture/**'
      - '.github/workflows/android-device.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/call-fixture/**'
      - '.github/workflows/android-device.yml'
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'App source revision to test; empty uses this workflow revision'
        type: string
        default: ''
      baseline_without_phone_permission:
        description: 'Pre-fix negative control only: allow absent phone permission (call tests must still fail)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  incoming-call:
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out app candidate separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || inputs.app_ref || github.sha }}
          path: source-app
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install build SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build app candidate
        working-directory: source-app
        run: |
          if grep -Fq 'create("community")' app/build.gradle.kts; then
            ./gradlew :app:assembleCommunityDebug :app:assemblePlayDebug --no-daemon --no-configuration-cache --max-workers=2
          else
            ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
          fi
      - name: Build isolated fixture
        run: ./gradlew -PcallFixture=true :call-fixture:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Telecom and SystemUI, then record Play first run
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          BASELINE_WITHOUT_PHONE_PERMISSION: ${{ inputs.baseline_without_phone_permission }}
          RUN_STORE_DEMO: 'true'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/call-fixture/ci.py
      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-api${{ matrix.api }}-${{ github.sha }}
          path: |
            build/device-regression/
            build/store-demo/
            tools/call-fixture/build/outputs/apk/debug/
            source-app/app/build/outputs/apk/community/debug/
            source-app/app/build/outputs/apk/play/debug/
            source-app/app/build/outputs/apk/debug/
          retention-days: 7
