name: Verify published APK reproduction

on:
  workflow_dispatch:
  push:
    branches: [release/store-distribution]
    paths:
      - '.github/workflows/reproducible.yml'
      - 'scripts/verify_reproducible_apk.py'

permissions:
  contents: read

jobs:
  verify-101:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This public PR merge is the actual build HEAD; its source tree is
          # identical to tag v1.0.1. AGP embedded HEAD into the historical APK.
          ref: b9b9869fae6865af7ad7775e52d0e3d671698448
          path: tagged-source
      - name: Prove exact public release source tree
        working-directory: tagged-source
        run: |
          git fetch origin 3f90ca53e420fb308dcbe48030566f8824ad1688
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse 3f90ca53e420fb308dcbe48030566f8824ad1688^{tree})"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # apksigcopier 1.1.1 relies on ZIP internals changed by Python 3.14.
          python-version: '3.11'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install matching SDK and signature tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"
          python3 -m pip install apksigcopier==1.1.1
      - name: Rebuild unmodified public tagged source
        working-directory: tagged-source
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache --max-workers=2
      - name: Match historical apksigner 35 padding
        run: |
          git clone https://gitlab.com/fdroid/reproducible-apk-tools.git build/repro-apk-tools
          git -C build/repro-apk-tools checkout ca728486d42a79f1c9ec0c6ec755c39f251911a8
          echo '7f8820cbe8049083d9b7a3088a41fda7bd895bb5ad5e6bb78b135a00021773a9  build/repro-apk-tools/zipalign.py' | sha256sum -c
          python3 build/repro-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace tagged-source/app/build/outputs/apk/release/app-release-unsigned.apk build/rebuilt-aligned.apk
      - name: Fetch immutable published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/reproducibility
          gh release download v1.0.1 --repo beejsbj/speedbreaker --pattern Speedbreaker-1.0.1.apk --dir build/reproducibility
      - name: Compare APK payload and copy actual signatures
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 scripts/verify_reproducible_apk.py build/reproducibility/Speedbreaker-1.0.1.apk build/rebuilt-aligned.apk --source-commit b9b9869fae6865af7ad7775e52d0e3d671698448 --normalization apksigner-35-padding --output build/reproducibility/receipt.json
      - name: Preserve public reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproduction-1.0.1-${{ github.sha }}
          path: |
            build/reproducibility/
            tagged-source/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
