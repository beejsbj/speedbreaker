name: Release

# Pushing a vX.Y.Z tag builds the community APK without secrets, then waits for the
# owner's approval of the `release` environment before signing and publishing it.
# A manual run with publish off signs and keeps the result as a workflow artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and sign, for example v1.0.3
        required: true
        type: string
      publish:
        description: Publish the GitHub release (off is a dry run that only keeps a workflow artifact)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    # No environment and no secrets: this job only produces an unsigned, policy-checked APK.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.identity.outputs.version }}
      version_code: ${{ steps.identity.outputs.version_code }}
      commit: ${{ steps.identity.outputs.commit }}
      tree: ${{ steps.identity.outputs.tree }}
      apk_sha256: ${{ steps.input.outputs.apk_sha256 }}
    steps:
      - name: Require a vX.Y.Z tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a vX.Y.Z release tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to match the app version and to be on main
        id: identity
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version" -a -n "$code" || { echo "::error::app/build.gradle.kts declares no version"; exit 1; }
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::Tagged commit is not on main"; exit 1; }
          {
            echo "version=$version"
            echo "version_code=$code"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # A release build starts from verified inputs, not from a restored cache.
          cache-disabled: true
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Validate inventory script
        run: python3 scripts/store_inventory.py self-test
      - name: Build unsigned release and resolve runtime inventory
        run: ./gradlew :app:assembleCommunityRelease :app:inventoryCommunityRelease --no-daemon --no-configuration-cache --max-workers=2
      - name: Collect POM licenses and verify final APK manifest
        run: |
          apk=app/build/outputs/apk/community/release/app-community-release-unsigned.apk
          inventory=app/build/store-inventory/community
          python3 scripts/store_inventory.py collect --dependencies "$inventory/dependencies.json" --output "$inventory"
          python3 scripts/store_inventory.py verify --channel community --apk "$apk" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output "$inventory"
      - name: Record the signing input
        id: input
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          TREE: ${{ steps.identity.outputs.tree }}
        run: |
          mkdir -p release-input
          cp app/build/outputs/apk/community/release/app-community-release-unsigned.apk release-input/
          cp -r app/build/store-inventory/community release-input/inventory
          digest=$(sha256sum release-input/app-community-release-unsigned.apk | cut -d ' ' -f 1)
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg commit "$COMMIT" --arg tree "$TREE" \
            --arg tag "$TAG" --arg digest "$digest" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{repository: $repository, source_commit: $commit, source_tree: $tree, tag: $tag,
              workflow: "release.yml", run_id: ($run_id | tonumber), run_attempt: ($attempt | tonumber),
              run_url: $url, input_sha256: $digest, channel: "community", kind: "apk"}' > release-input/release-input.json
          echo "apk_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Preserve the unsigned input and its evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-input-${{ env.TAG }}
          path: release-input/
          if-no-files-found: error
          retention-days: 30

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewer and tag-only deployment policy live on the environment. Its secrets
    # exist only for this job; the build above never sees them.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      COMMIT: ${{ needs.build.outputs.commit }}
      TREE: ${{ needs.build.outputs.tree }}
      APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require a vX.Y.Z tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a vX.Y.Z release tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit that was built, not whatever the tag names after the approval wait.
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Signing code and the public lineage come from the commit this workflow runs from.
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Confirm the tag still names the built commit
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT" -a "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          current=$(printf '%s\n' "$refs" | awk -v peeled="refs/tags/$TAG^{}" -v plain="refs/tags/$TAG" \
            '$2 == peeled {p = $1} $2 == plain {t = $1} END {print (p != "" ? p : t)}')
          [ "$current" = "$COMMIT" ] || { echo "::error::$TAG now points at '$current', not the built $COMMIT"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-input-${{ env.TAG }}
          path: ${{ runner.temp }}/release-input
      - name: Require the downloaded APK to be the one that was built
        run: |
          input="$RUNNER_TEMP/release-input"
          digest=$(sha256sum "$input/app-community-release-unsigned.apk" | cut -d ' ' -f 1)
          [ "$digest" = "$APK_SHA256" ] || { echo "::error::Unsigned APK differs from the build job's output"; exit 1; }
          [ "$(jq -r .input_sha256 "$input/release-input.json")" = "$digest" ]
      - name: Install build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "build-tools;36.0.0"'
      - name: Re-apply the final APK policy before any credential is restored
        run: python3 scripts/store_inventory.py verify --channel community --apk "$RUNNER_TEMP/release-input/app-community-release-unsigned.apk" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output "$RUNNER_TEMP/policy"
      - name: Restore the signing keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SPEEDBREAKER_RELEASE_KEYSTORE_BASE64 }}
          LEGACY_KEYSTORE_BASE64: ${{ secrets.SPEEDBREAKER_LEGACY_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          printf '%s' "$LEGACY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/legacy.jks"
      - name: Sign and verify with the shared signing script
        env:
          SPEEDBREAKER_RELEASE_PASSWORD: ${{ secrets.SPEEDBREAKER_RELEASE_PASSWORD }}
        run: |
          python3 .release-tools/scripts/sign_apk.py \
            --unsigned-apk "$RUNNER_TEMP/release-input/app-community-release-unsigned.apk" \
            --output-dir dist \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --legacy-keystore "$RUNNER_TEMP/keys/legacy.jks" \
            --release-keystore "$RUNNER_TEMP/keys/release.jks" \
            --commit "$COMMIT" --tree "$TREE" \
            --build-receipt "$RUNNER_TEMP/release-input/release-input.json"
      - name: Delete the keystores
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/keys" ]; then
            find "$RUNNER_TEMP/keys" -type f -exec shred -u {} +
            rm -rf "$RUNNER_TEMP/keys"
          fi
      - name: Check the signed files and compose the release notes
        id: signed
        run: |
          apk="dist/Speedbreaker-$VERSION.apk"
          test "$(ls dist | wc -l)" -eq 3
          digest=$(sha256sum "$apk" | cut -d ' ' -f 1)
          [ "$(cut -d ' ' -f 1 "$apk.sha256")" = "$digest" ]
          [ "$(jq -r .sha256 "dist/Speedbreaker-$VERSION.json")" = "$digest" ]
          flags=()
          if [ "$PUBLISH" = true ]; then flags+=(--require-dated); fi
          python3 .release-tools/scripts/release_notes.py --version "$VERSION" --version-code "$VERSION_CODE" \
            --commit "$COMMIT" --sha256 "$digest" --changelog CHANGELOG.md --output release-notes.md "${flags[@]}"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Speedbreaker $VERSION ($TAG)"
            echo "- Source: \`$COMMIT\`, version code $VERSION_CODE"
            echo "- Signed APK SHA-256: \`$digest\`"
            if [ "$PUBLISH" = true ]; then echo "- Publishing the GitHub release"; else echo "- Dry run: nothing published; signed files are in the workflow artifact"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the signed files of a dry run as a workflow artifact
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-dry-run-${{ env.TAG }}
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists; assets are never overwritten"
            exit 1
          fi
          gh release create "$TAG" "dist/Speedbreaker-$VERSION.apk" "dist/Speedbreaker-$VERSION.apk.sha256" "dist/Speedbreaker-$VERSION.json" \
            --verify-tag --title "Speedbreaker $VERSION" --notes-file release-notes.md
      - name: Download the published APK and compare its SHA-256
        if: env.PUBLISH == 'true'
        env:
          SIGNED_SHA256: ${{ steps.signed.outputs.sha256 }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$TAG" --pattern "Speedbreaker-$VERSION.apk" --dir "$RUNNER_TEMP/published"
          published=$(sha256sum "$RUNNER_TEMP/published/Speedbreaker-$VERSION.apk" | cut -d ' ' -f 1)
          [ "$published" = "$SIGNED_SHA256" ] || { echo "::error::Published APK $published differs from the signed $SIGNED_SHA256"; exit 1; }
          echo "- Published asset re-downloaded and matches: \`$published\`" >> "$GITHUB_STEP_SUMMARY"
