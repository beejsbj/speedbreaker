name: Android 16 KB native pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/check_native_pages.py'
      - 'tools/call-fixture/**'
      - '.github/workflows/android-pages.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/check_native_pages.py'
      - 'tools/call-fixture/**'
      - '.github/workflows/android-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: /tmp/native-pages-avds-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install emulator shared library on hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
      - name: Install build and explicit 16 KB emulator SDK
        run: |
          mkdir -p build/native-pages
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis_ps16k;x86_64" 2>&1 | tee build/native-pages/sdk-install.txt
          "$ANDROID_HOME/emulator/emulator" -version > build/native-pages/emulator-version.txt 2>&1
      - name: Build Play debug app and opt-in fixture with shared debug key
        run: ./gradlew -PcallFixture=true :app:assemblePlayDebug :call-fixture:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
      - name: Record static ELF, literal RELRO formula, and APK ZIP alignment
        run: |
          python3 scripts/check_native_pages.py --mode static --apk app/build/outputs/apk/play/debug/app-play-debug.apk --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign" --output build/native-pages/static
      - name: Enable KVM on disposable hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot explicitly selected 16 KB AVD
        run: |
          free -m > build/native-pages/host-free-before-emulator.txt
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name native-pages-ci --path "$ANDROID_AVD_HOME/native-pages-ci.avd" --package 'system-images;android-36;google_apis_ps16k;x86_64' --device pixel_6
          # The Pixel profile's 1.5 GB default lets this 16 KB image kill foreground apps.
          sed -i 's/^hw.ramSize=.*/hw.ramSize=4096M/' "$ANDROID_AVD_HOME/native-pages-ci.avd/config.ini"
          cat "$ANDROID_AVD_HOME/native-pages-ci.avd/config.ini" > build/native-pages/avd-config.ini
          nohup "$ANDROID_HOME/emulator/emulator" -avd native-pages-ci -port 5554 -memory 4096 -cores 2 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > build/native-pages/emulator.txt 2>&1 &
          timeout 90 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      # The runtime check relaunches the app once if the Welcome screen is absent (known
      # first-launch emulator flake); every other failure is final.
      - name: Exercise target APK native library with compatibility mode off
        run: |
          python3 scripts/check_native_pages.py --mode runtime --apk app/build/outputs/apk/play/debug/app-play-debug.apk --fixture tools/call-fixture/build/outputs/apk/debug/call-fixture-debug.apk --adb "$ANDROID_HOME/platform-tools/adb" --output build/native-pages/runtime
      - name: Record final host and guest memory even on failure
        if: always()
        run: |
          mkdir -p build/native-pages
          free -m > build/native-pages/host-free-after-test.txt
          timeout 15 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell free -m > build/native-pages/guest-free-after-test.txt 2>&1 || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell cat /proc/meminfo > build/native-pages/guest-meminfo-after-test.txt 2>&1 || true
      - name: Preserve evidence on success and failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-pages-${{ github.sha }}
          path: |
            build/native-pages/
            app/build/outputs/apk/play/debug/
            tools/call-fixture/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 30
      - name: Dispose of test emulator
        if: always()
        run: '"$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true'
