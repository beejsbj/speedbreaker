name: Android checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: community
            variant: Community
          - channel: play
            variant: Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build unsigned release
        run: ./gradlew :app:assemble${{ matrix.variant }}Release --no-daemon --no-configuration-cache --max-workers=2
      - name: Preserve unsigned APK from this commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.channel }}-release-${{ github.sha }}
          path: app/build/outputs/apk/${{ matrix.channel }}/release/app-${{ matrix.channel }}-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned Play bundle
        if: matrix.channel == 'play'
        run: ./gradlew :app:bundlePlayRelease --no-daemon --no-configuration-cache --max-workers=2
      - name: Preserve unsigned bundle from this commit
        if: matrix.channel == 'play'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-bundle-${{ github.sha }}
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Unit and UI regression tests
        run: ./gradlew :app:test${{ matrix.variant }}DebugUnitTest --no-daemon --no-configuration-cache --max-workers=2
      - name: Release lint
        run: ./gradlew :app:lint${{ matrix.variant }}Release --no-daemon --no-configuration-cache --max-workers=2
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.channel }}-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/
          retention-days: 7
