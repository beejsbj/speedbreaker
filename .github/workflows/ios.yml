name: iOS feasibility compile

on:
  push:
    branches: [main, release/ios-feasibility]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record compiler and SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Generate with verified XcodeGen 2.46.0
        run: ios/scripts/generate.sh
      - name: Compile app and all three embedded extensions (unsigned device build)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/Speedbreaker.xcodeproj -scheme Speedbreaker \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build -resultBundlePath ios/compile.xcresult \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/compile.log
      - name: Preserve compilation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-compile-${{ github.sha }}
          path: |
            ios/compile.log
            ios/compile.xcresult
            ios/Speedbreaker.xcodeproj
          if-no-files-found: warn
          retention-days: 7
